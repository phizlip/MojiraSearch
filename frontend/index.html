<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojiraSearch</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>MojiraSearch</h1>

        <div class="search-section" id="searchWrapper">
            <select id="searchMode" title="Search Mode" autocomplete="off">
                <option value="semantic">Semantic Search</option>
                <option value="duplicate">Duplicate Check</option>
            </select>
            <select id="projectSelect" title="Target Project" autocomplete="off">
                <option value="">All Projects</option>
                <option value="MC">MC</option>
                <option value="MCPE">MCPE</option>
                <option value="MCL">MCL</option>
                <option value="REALMS">REALMS</option>
                <option value="WEB">WEB</option>
                <option value="BDS">BDS</option>
            </select>
            <select id="sortOrder" title="Sort Order" autocomplete="off">
                <option value="relevance">Relevance</option>
                <option value="newest">Newest</option>
            </select>
            <select id="openWith" title="Open With" autocomplete="off">
                <option value="mojira">mojira.dev</option>
                <option value="bugs_legacy">bugs-legacy.mojang.com</option>
                <option value="bugs">bugs.mojang.com</option>
                <option value="report">report.bugs.mojang.com</option>
                <option value="atlassian">mojira.atlassian.net</option>
            </select>
            <input type="text" id="searchInput" placeholder="Describe a bug report" autocomplete="off" autofocus>
            <button id="searchBtn">Search</button>
        </div>

        <div class="results" id="results">
        </div>

        <status-bar id="statusFooter"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><path d="M2.75 1h10.5a.75.75 0 0 1 0 1.5h-.75v1.25a4.75 4.75 0 0 1-1.9 3.8l-.333.25a.25.25 0 0 0 0 .4l.333.25a4.75 4.75 0 0 1 1.9 3.8v1.25h.75a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5h.75v-1.25a4.75 4.75 0 0 1 1.9-3.8l.333-.25a.25.25 0 0 0 0-.4L5.4 7.55a4.75 4.75 0 0 1-1.9-3.8V2.5h-.75a.75.75 0 0 1 0-1.5ZM11 2.5H5v1.25c0 1.023.482 1.986 1.3 2.6l.333.25c.934.7.934 2.1 0 2.8l-.333.25a3.251 3.251 0 0 0-1.3 2.6v1.25h6v-1.25a3.251 3.251 0 0 0-1.3-2.6l-.333-.25a1.748 1.748 0 0 1 0-2.8l.333-.25a3.251 3.251 0 0 0 1.3-2.6Z"></path></svg></status-bar>

        <footer class="page-footer">
            <span>Not affiliated with Mojang or Microsoft.</span>
            <a href="https://github.com/phizlip/MojiraSearch" target="_blank" class="footer-github" title="GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"></path></svg>
            </a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
