<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojiraSearch</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --border: #d4d4d8;
            --muted: #000000;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 3rem 1.5rem;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 2rem 0;
            font-weight: normal;
        }

        .search-section {
            display: flex;
            flex-direction: row;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        select,
        input[type="text"],
        button {
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--fg);
            border-radius: 0;
            outline: none;
            font-weight: normal;
        }

        input[type="text"]:focus,
        select:focus,
        button:focus,
        button:hover {
            /* keep border at 1px on focus */
            outline: none;
            border: 1px solid var(--fg);
        }

        select {
            cursor: pointer;
            width: max-content;
        }

        input[type="text"] {
            flex-grow: 1;
        }

        button {
            cursor: pointer;
            width: auto;
            white-space: nowrap;
        }

        button:hover {
            border-color: var(--fg);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            border: 1px solid var(--border);
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card:hover,
        .card:focus {
            border-color: var(--fg);
            outline: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .score {
            font-weight: normal;
            color: var(--muted);
        }

        .card-title {
            font-size: 1.05rem;
            margin: 0;
            font-weight: normal;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-top: 0.5rem;
        }

        .card-updated {
            font-size: 0.8rem;
            color: var(--muted);
            margin-left: auto;
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        input::placeholder {
            color: var(--muted);
            opacity: 1;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 2rem 1rem;
            }

            h1 {
                font-size: 1.25rem;
                margin-bottom: 1.5rem;
            }

            .search-section {
                flex-direction: column;
                gap: 0.75rem;
            }

            select,
            button {
                width: 100%;
            }

            .card {
                padding: 1rem;
            }

            .card-header {
                flex-direction: column;
                gap: 0.25rem;
            }

            .card-meta {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>MojiraSearch</h1>

        <div class="search-section" id="searchWrapper">
            <select id="searchMode" title="Search Mode" autocomplete="off">
                <option value="semantic">Semantic Search</option>
                <option value="duplicate">Duplicate Check</option>
            </select>
            <select id="projectSelect" title="Target Project" autocomplete="off">
                <option value="">All Projects</option>
                <option value="MC">MC</option>
                <option value="MCPE">MCPE</option>
                <option value="MCL">MCL</option>
                <option value="REALMS">REALMS</option>
                <option value="WEB">WEB</option>
                <option value="BDS">BDS</option>
            </select>
            <select id="sortOrder" title="Sort Order" autocomplete="off">
                <option value="relevance">Relevance</option>
                <option value="newest">Newest</option>
            </select>
            <select id="openWith" title="Open With" autocomplete="off">
                <option value="mojira">mojira.dev</option>
                <option value="bugs_legacy">bugs-legacy.mojang.com</option>
                <option value="bugs">bugs.mojang.com</option>
                <option value="report">report.bugs.mojang.com</option>
                <option value="atlassian">mojira.atlassian.net</option>
            </select>
            <input type="text" id="searchInput" placeholder="Describe a bug report" autocomplete="off" autofocus>
            <button id="searchBtn">Search</button>
        </div>

        <div class="results" id="results">

        </div>
    </div>

    <script>
        const API_BASE = '/api';

        const searchInput = document.getElementById('searchInput');
        const projectSelect = document.getElementById('projectSelect');
        const sortOrder = document.getElementById('sortOrder');
        const openWith = document.getElementById('openWith');
        const searchMode = document.getElementById('searchMode');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('results');
        const searchWrapper = document.getElementById('searchWrapper');

        // reset inputs on load
        window.onload = () => {
            searchMode.value = 'semantic';
            projectSelect.value = '';
            sortOrder.value = 'relevance';
            openWith.value = 'mojira';
            searchInput.value = '';
            searchInput.placeholder = 'Describe a bug report';
        };

        function getIssueUrl(key) {
            const tracker = openWith.value;
            if (tracker === 'bugs_legacy') return `https://bugs-legacy.mojang.com/browse/${key}`;
            if (tracker === 'bugs')        return `https://bugs.mojang.com/browse/${key}`;
            if (tracker === 'report')      return `https://report.bugs.mojang.com/servicedesk/customer/portal/2/${key}`;
            if (tracker === 'atlassian')   return `https://mojira.atlassian.net/browse/${key}`;
            return `https://mojira.dev/${key}`;
        }

        function displayResults(results) {
            resultsContainer.innerHTML = '';

            if (!results || results.length === 0) {
                resultsContainer.innerHTML = `<div style="color: var(--fg); padding: 1rem 0;">No matches found.</div>`;
                return;
            }

            results.forEach(issue => {
                const card = document.createElement('a');
                card.href = getIssueUrl(issue.key);
                card.target = "_blank";
                card.className = "card";

                const scorePercent = (issue.score * 100).toFixed(1);
                const dateSplit = (issue.updated_date || '').substring(0, 10);

                card.innerHTML = `
                    <div class="card-header">
                        <span style="color: var(--fg); font-weight: normal;">${issue.key}</span>
                        <span class="score">${scorePercent}% Relevance</span>
                    </div>
                    <h3 class="card-title">${issue.summary}</h3>
                    <div class="card-footer">
                        <div class="card-meta">
                            <span>Resolution: ${(!issue.resolution || issue.resolution === "Unresolved") ? "Unresolved" : issue.resolution}</span>
                        </div>
                        <div class="card-updated">Updated: ${dateSplit}</div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const mode = searchMode.value;
            const currentProject = projectSelect.value;

            searchWrapper.classList.add('loading');
            try {
                let url;

                if (mode === 'duplicate') {
                    const sort = sortOrder.value;
                    url = `${API_BASE}/similar/${query.toUpperCase()}?sort=${sort}`;
                    if (currentProject) {
                        url += `&project=${currentProject}`;
                    }
                } else {
                    const sort = sortOrder.value;
                    url = `${API_BASE}/search?q=${encodeURIComponent(query)}&sort=${sort}`;
                    if (currentProject) {
                        url += `&project=${currentProject}`;
                    }
                }

                const res = await fetch(url);
                if (!res.ok) {
                    if (res.status === 404) throw new Error("Issue key not found in index.");
                    if (res.status === 400) throw new Error("Invalid issue key format (e.g. MC-6767).");
                    throw new Error("API Error: " + res.statusText);
                }
                const data = await res.json();
                displayResults(data.results);

            } catch (e) {
                resultsContainer.innerHTML = `<div style="color: red;">${e.message}</div>`;
            } finally {
                searchWrapper.classList.remove('loading');
            }
        }

        searchMode.addEventListener('change', () => {
            if (searchMode.value === 'duplicate') {
                searchInput.placeholder = "Enter an issue key (e.g. MC-6767)";
            } else {
                searchInput.placeholder = "Describe a bug report";
            }
            if (searchInput.value.trim()) performSearch();
        });

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        projectSelect.addEventListener('change', () => {
            if (searchInput.value.trim()) performSearch();
        });
        sortOrder.addEventListener('change', () => {
            if (searchInput.value.trim()) performSearch();
        });
        openWith.addEventListener('change', () => {
            if (searchInput.value.trim()) performSearch();
        });


    </script>
</body>

</html>
